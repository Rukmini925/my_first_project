<!DOCTYPE html>
<html>
<head>
    <title>Online Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Marks Calculator</h1>

        <input type="text" id="name" placeholder="Enter Student Name">

        <input type="number" id="m1" placeholder="Enter Subject 1 Marks">

        <input type="number" id="m2" placeholder="Enter Subject 2 Marks">

        <input type="number" id="m3" placeholder="Enter Subject 3 Marks">

        <button onclick="calculateMarks()">Calculate</button>

        <h2 id="result"></h2>
    </div>

    <script src="script.js"></script>

</body>
</html>
